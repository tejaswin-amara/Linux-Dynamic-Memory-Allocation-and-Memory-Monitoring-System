name: Systems CI Pipeline

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build-and-test:
    runs-on: ubuntu-24.04

    strategy:
      matrix:
        compiler: [gcc, clang]

    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y ${{ matrix.compiler }} make valgrind libncurses-dev clang-format

      - name: Verify Code Formatting
        run: |
          clang-format --dry-run --Werror src/**/*.c include/*.h tests/*.c

      - name: Compile (Strict C11)
        run: |
          make clean
          CC=${{ matrix.compiler }} make all

      - name: Run Unit & Integration Tests
        run: |
          CC=${{ matrix.compiler }} make test

      - name: AddressSanitizer & UndefinedBehaviorSanitizer (ASan/UBSan)
        run: |
          make clean
          CC=${{ matrix.compiler }} make asan
          ./test_allocator
          ./test_proc_parser
          ./test_signal_handler
          ./test_gui_server

      - name: Valgrind Leak Verification
        run: |
          make clean
          CC=${{ matrix.compiler }} make all
          make valgrind

      - name: Measure mem_monitor RSS
        run: |
          set -euo pipefail
          ./mem_monitor --headless --port 9111 --token x &
          MONITOR_PID=$!
          trap 'kill -INT "$MONITOR_PID" 2>/dev/null || true; wait "$MONITOR_PID" 2>/dev/null || true' EXIT
          sleep 3
          curl -s -o /dev/null http://127.0.0.1:9111/api/metrics
          grep -E "VmRSS|RssAnon|RssFile" /proc/$MONITOR_PID/status
          kill -INT "$MONITOR_PID"
          wait "$MONITOR_PID"
          trap - EXIT

      - name: Run Benchmarks
        run: |
          bash scripts/benchmark.sh
